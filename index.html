<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTheBhadman Reminder</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #8EC5FC, #E0C3FC);
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #333;
        }
        .container {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }
        h1 {
            font-size: 2em;
            margin: 0;
            color: #333;
        }
        p {
            font-size: 1.2em;
            margin: 15px 0;
            color: #666;
        }
        .heart {
            color: #e74c3c;
            animation: pulse 1.5s infinite;
        }
        .countdown {
            background: #f4f4f9;
            padding: 10px;
            border-radius: 5px;
            color: #555;
            margin: 20px 0;
            font-weight: bold;
        }
        .reminder {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 15px;
            max-width: 300px;
            z-index: 999;
        }
        .reminder h3 {
            margin: 0 0 10px;
            color: #333;
        }
        .reminder button {
            background: #3498db;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hey ZeroTheBhadman,</h1>
        <p>I see how hard you're coding, and I just wanted to remind you...</p>
        <p>You are amazing, and I'm so proud of you. ❤️</p>
        <p>Even from afar, I hope you feel my support. Keep shining!</p>
        <p>Can't wait to chop the money together</p>
        <div class="countdown">
            Next <span id="nextMeal">Meal</span> in: <span id="countdown">Loading...</span>
        </div>

        <p class="heart">❤️</p>
    </div>

    <!-- Reminder Pop-Up -->
    <div class="reminder" id="reminder">
        <h3>Hey ZeroTheBhadman! 😂</h3>
        <p id="reminderMessage"></p>
        <button onclick="closeReminder()">Oya, I Don Hear!</button>
    </div>

    <script>
        const mealTimes = [
            { name: "Breakfast", hour: 9, minute: 0 },
            { name: "Lunch", hour: 13, minute: 0 },
            { name: "Dinner", hour: 19, minute: 0 }
        ];

        function getNextMealTime() {
            const now = new Date();
            for (let meal of mealTimes) {
                const nextMeal = new Date();
                nextMeal.setHours(meal.hour, meal.minute, 0, 0);
                if (nextMeal > now) {
                    return meal;
                }
            }
            const tomorrowMeal = { ...mealTimes[0] };
            tomorrowMeal.isTomorrow = true;
            return tomorrowMeal;
        }

        function updateCountdown() {
            const now = new Date();
            const nextMeal = getNextMealTime();
            let targetTime = new Date();

            if (nextMeal.isTomorrow) {
                targetTime.setDate(targetTime.getDate() + 1);
            }
            targetTime.setHours(nextMeal.hour, nextMeal.minute, 0, 0);

            const timeDiff = targetTime - now;

            const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);

            document.getElementById("nextMeal").innerText = nextMeal.name;
            document.getElementById("countdown").innerText = 
                `${hours}h ${minutes}m ${seconds}s`;

            if (timeDiff < 1000) {
                switch (nextMeal.name) {
                    case "Breakfast":
                        showReminder("No go code forget breakfast! 👀😂");
                        break;
                    case "Lunch":
                        showReminder("Guy, chop lunch o! 👀😂 Make brain no pause!");
                        break;
                    case "Dinner":
                        showReminder("ZeroTheBhadman, no go code forget dinner! 🍲💪 Fuel up, make we no loose energy 😂");
                        break;
                }
            }
        }

        function showReminder(message) {
            const reminderBox = document.getElementById("reminder");
            const reminderMessage = document.getElementById("reminderMessage");
            reminderMessage.innerText = message;
            reminderBox.style.display = "block";
        }

        function closeReminder() {
            document.getElementById("reminder").style.display = "none";
        }

        // Update every second
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
