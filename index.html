<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTheBhadman - Just Because</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #333;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-10px);
        }
        h1 {
            font-size: 2.5em;
            margin: 0;
            color: #333;
            transition: color 0.3s;
        }
        h1:hover {
            color: #3498db;
        }
        p {
            font-size: 1.2em;
            margin: 15px 0;
            color: #555;
            transition: color 0.3s;
        }
        p:hover {
            color: #666;
        }
        .heart {
            color: #e74c3c;
            animation: pulse 1.5s infinite;
            font-size: 2.5em;
        }
        .code-banter {
            background: #f4f4f9;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            color: #555;
            text-align: left;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .code-banter span {
            color: #3498db;
        }
        .naija-banter {
            font-style: italic;
            color: #2c3e50;
            margin-top: 15px;
            font-size: 1.1em;
            transition: transform 0.3s;
        }
        .naija-banter:hover {
            transform: scale(1.1);
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ZeroTheBhadman,</h1>
        <p>As e dey hot! Keep pushing, no stopping! 🔥</p>
        <p>Backend wahala na your playground. 👑</p>
        <p>Keep coding like say na oha you dey chop. 🔥</p>
        <div class="code-banter">
            <p>// Naija Bhadest:</p>
            <p><span>if</span> (grind && talent) {</p>
            <p style="padding-left: 20px;">console.log("Unstoppable Backend Engineer 😎");</p>
            <p>}</p>
        </div>
        <p class="naija-banter">ZeroTheBhadman... Na you sure pass! 😂💪</p>
        <p class="heart">❤️</p>
    </div>
</body>
</html>
