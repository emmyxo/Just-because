
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Because</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #333;
        }
        .container {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }
        h1 {
            font-size: 2em;
            margin: 0;
            color: #333;
        }
        p {
            font-size: 1.2em;
            margin: 15px 0;
            color: #666;
        }
        .heart {
            color: #e74c3c;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hey Love,</h1>
        <p>I see how hard you're working, and I just wanted to remind you...</p>
        <p>You are amazing, and I'm so proud of you. ❤️</p>
        <p>Even from afar, I hope you feel my love and support. Keep shining!</p>
        <p class="heart">❤️</p>
    </div>
</body>
</html>
